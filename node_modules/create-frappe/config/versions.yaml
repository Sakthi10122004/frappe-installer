# ============================================================================
# Frappe Installer — Dependency Version Matrix
# ============================================================================
#
# This file is the HUMAN-READABLE reference for all dependency version
# requirements per Frappe major version. The runtime shell variables that
# the installer actually uses are defined in lib/constants.sh, which must
# stay in sync with this file.
#
# Last verified: 2026-08-19 against:
#   - frappe/frappe pyproject.toml (version-15 and version-16 branches)
#   - frappe/bench pyproject.toml
#   - Official Frappe docs / wiki "Migrating to version 16" page
#
# These pins WILL drift as Frappe releases point updates. Re-verify
# before relying on these for a new Frappe release.
# ============================================================================

frappe:
  "15":
    branch: "version-15"
    python: "3.10"            # pyproject.toml: requires-python = ">=3.10,<3.13"
    node: "18"                # Frappe v15 build tooling
    mariadb_min: "10.6"       # Documented minimum
    mariadb_recommended: "10.6"
    redis_min: "6"
    redis_recommended: "6"
    yarn: "1"                 # 1.12+
    pip_min: "20"
    wkhtmltopdf: "0.12.6"    # Patched Qt build
    nvm: "v0.40.3"
    bench_install: "uv tool install frappe-bench"
    os_support:
      ubuntu_min: "22.04"     # Official support
      debian_min: "12"        # Bookworm
    eol: "2027-12-31"

  "16":
    branch: "version-16"
    python: "3.14"            # pyproject.toml: requires-python = ">=3.14,<3.15"
    node: "24"                # Frappe v16 build tooling / current guidance
    mariadb_min: "10.6"       # 10.6.6+ documented minimum
    mariadb_recommended: "11.8"
    redis_min: "6"
    redis_recommended: "8"
    yarn: "1"                 # 1.22+
    pip_min: "25.3"
    wkhtmltopdf: "0.12.6"    # Patched Qt build (archived project, Frappe still requires it)
    nvm: "v0.40.3"
    bench_install: "uv tool install frappe-bench"
    os_support:
      ubuntu_min: "24.04"     # Official support
      debian_min: "13"        # Trixie
    eol: "2029-12-31"
