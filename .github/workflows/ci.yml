name: CI

on:
  push:
    branches: [main]   # tags run CI through release.yml instead
  workflow_dispatch:   # manual run from the Actions tab
  workflow_call:       # used by release.yml before publishing

jobs:
  lint-and-unit:
    name: shellcheck + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning -e SC1091,SC2034,SC2154,SC2164 \
            install-frappe.sh lib/*.sh tools/*.sh tests/e2e/run.sh tests/e2e/annotate.sh
      - name: unit tests
        run: |
          rc=0
          for t in tests/test-*.sh; do
            echo "::group::${t}"
            bash "${t}" || rc=1
            echo "::endgroup::"
          done
          exit "${rc}"

  e2e:
    # Full installs on fresh machines (Docker containers running systemd).
    name: e2e ${{ matrix.name }}
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04 / frappe-15 / local
            image: ubuntu:22.04
            version: "15"
            env: local
          - name: debian-12 / frappe-15 / local
            image: debian:12
            version: "15"
            env: local
          - name: ubuntu-24.04 / frappe-16 / local
            image: ubuntu:24.04
            version: "16"
            env: local
          - name: debian-13 / frappe-16 / local
            image: debian:13
            version: "16"
            env: local
          - name: ubuntu-26.04 / frappe-16 / local
            # Its MariaDB ships an active AppArmor profile: exercises extending it.
            image: ubuntu:26.04
            version: "16"
            env: local
          - name: ubuntu-24.04 / frappe-16 / prod
            image: ubuntu:24.04
            version: "16"
            env: prod
            args: --domain erp.example.test --no-firewall
          - name: ubuntu-24.04 / two environments side by side (isolation)
            image: ubuntu:24.04
            version: "16"
            env: local
            # Second install next to the first: own ports, own DB instance;
            # its verification fails if the first environment changed at all.
            then: --version 16 --path /home/frappe/frappe16b --site b.local
          - name: ubuntu-24.04 / frappe-16 / via npm create
            image: ubuntu:24.04
            version: "16"
            env: local
            via_npm: "1"
          - name: ubuntu-24.04 / frappe-15 → 16 upgrade
            image: ubuntu:24.04
            version: "15"
            env: local
            then: --action upgrade --version 16 --path /home/frappe/frappe15
    steps:
      - uses: actions/checkout@v5
      - name: install
        env:
          THEN: ${{ matrix.then }}
          VIA_NPM: ${{ matrix.via_npm }}
        run: tests/e2e/run.sh "${{ matrix.image }}" "${{ matrix.version }}" "${{ matrix.env }}" -- ${{ matrix.args }}
