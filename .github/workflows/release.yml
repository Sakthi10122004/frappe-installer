name: Release

# Release: `npm version patch|minor|major && git push --follow-tags`
# (bumps package.json + INSTALLER_VERSION, commits, tags vX.Y.Z). Nothing is
# published unless the full CI (lint, unit tests, fresh-machine installs)
# passes on that exact commit.
#
# Authentication: npm trusted publishing (OIDC) — no token stored anywhere.
# One-time setup on npmjs.com → create-frappe → Settings → Trusted Publisher:
#   GitHub Actions · Sakthi10122004 / frappe-installer · workflow release.yml
# (Fallback only: a granular npm token in the repository secret NPM_TOKEN.)

on:
  push:
    tags: ["v*"]

jobs:
  versions:
    name: version numbers agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tag = package.json = INSTALLER_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          sh_ver="$(sed -n 's/^INSTALLER_VERSION="\(.*\)"$/\1/p' lib/constants.sh)"
          echo "tag=${tag} package.json=${pkg} INSTALLER_VERSION=${sh_ver}"
          [[ "${tag}" == "${pkg}" && "${pkg}" == "${sh_ver}" ]]

  ci:
    needs: versions
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm + GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm provenance (links the package to this commit)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24          # npm >= 11.5.1 is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm --version

      - name: pack
        run: |
          npm pack
          sha256sum create-frappe-*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: publish to npm (trusted publishing, with provenance)
        run: npm publish create-frappe-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # unused once trusted publishing is set up

      - name: GitHub Release (tarball + checksums, for servers without Node)
        run: gh release create "${GITHUB_REF_NAME}" create-frappe-*.tgz SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
