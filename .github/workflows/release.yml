name: Release

# Release: `npm version patch|minor|major && git push --follow-tags`
# (bumps package.json + INSTALLER_VERSION, commits, tags vX.Y.Z). Nothing is
# published unless the full CI (lint, unit tests, fresh-machine installs)
# passes on that exact commit.
#
# Authentication: npm trusted publishing (OIDC) — no token stored anywhere.
# One-time setup on npmjs.com → create-frappe → Settings → Trusted Publisher:
#   GitHub Actions · Sakthi10122004 / frappe-installer · workflow release.yml
# (Fallback only: a granular npm token in the repository secret NPM_TOKEN.)

on:
  push:
    tags: ["v*"]

jobs:
  versions:
    name: version numbers agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tag = package.json = INSTALLER_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          sh_ver="$(sed -n 's/^INSTALLER_VERSION="\(.*\)"$/\1/p' lib/constants.sh)"
          echo "tag=${tag} package.json=${pkg} INSTALLER_VERSION=${sh_ver}"
          [[ "${tag}" == "${pkg}" && "${pkg}" == "${sh_ver}" ]]

  ci:
    needs: versions
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm + GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm provenance (links the package to this commit)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24          # npm >= 11.5.1 is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm --version

      - name: pack
        run: |
          npm pack
          sha256sum create-frappe-*.tgz > SHA256SUMS
          cat SHA256SUMS

      # Pre-releases (1.0.0-rc.1) go to the "next" tag, so `npm create
      # frappe@latest` keeps the last stable version; testers opt in with @next.
      - name: npm tag (latest, or next for pre-releases)
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "tag=next" >> "${GITHUB_OUTPUT}"; echo "prerelease=--prerelease" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=latest" >> "${GITHUB_OUTPUT}"; echo "prerelease=" >> "${GITHUB_OUTPUT}"
          fi

      - name: publish to npm (trusted publishing, with provenance)
        run: npm publish create-frappe-*.tgz --provenance --access public --tag "${{ steps.channel.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # unused once trusted publishing is set up

      # Release notes: this version's section of CHANGELOG.md (falls back to
      # GitHub's generated notes when the version has no section).
      - name: GitHub Release (tarball + checksums, for servers without Node)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" 'index($0, "## " v " ") == 1 || $0 == "## " v {on = 1; next}
                                 on && /^## / {exit}
                                 on' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "${GITHUB_REF_NAME}" create-frappe-*.tgz SHA256SUMS "${notes[@]}" ${{ steps.channel.outputs.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
